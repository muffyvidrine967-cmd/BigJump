name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Dart core analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Analyze and test secure_dns_core
        working-directory: packages/secure_dns_core
        run: |
          dart pub get
          dart analyze
          dart test

  flutter:
    name: Flutter app analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze

  electron:
    name: Electron syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: windows_electron/package-lock.json
      - name: Install dependencies
        working-directory: windows_electron
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        working-directory: windows_electron
        run: |
          for f in main.js preload.js build-windows.js ui/renderer.js core/*.js; do
            node --check "$f"
          done
