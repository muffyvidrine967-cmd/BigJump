name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

concurrency:
  group: bigjump-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Patch flutter_inappwebview proguard config
        shell: bash
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" \
            -path '*/flutter_inappwebview_android-*/android/build.gradle' \
            -print0 | xargs -0 -r sed -i \
            's/proguard-android\.txt/proguard-android-optimize.txt/g'

      - name: Build arm64 release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        shell: bash
        run: |
          APK_DIR=app/build/app/outputs/flutter-apk
          SRC="$APK_DIR/app-arm64-v8a-release.apk"
          if [ ! -f "$SRC" ]; then
            SRC="$(find "$APK_DIR" -maxdepth 1 -name '*.apk' -print -quit)"
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "No APK found under $APK_DIR" >&2
            exit 1
          fi
          echo "Using APK: $SRC"
          cp "$SRC" BigJump-Android-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigJump-Android-arm64
          path: BigJump-Android-arm64.apk
          if-no-files-found: error

  windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: windows_electron/package-lock.json

      - name: Install dependencies
        working-directory: windows_electron
        run: npm ci

      - name: Build portable EXE
        working-directory: windows_electron
        run: npm run pack

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $src = "dist/windows/BigJump-win32-x64"
          if (-not (Test-Path $src)) {
            $candidate = Get-ChildItem -Path dist/windows -Directory -Filter 'BigJump*' |
              Select-Object -First 1
            if ($candidate) { $src = $candidate.FullName }
            else { throw "Packager output not found under dist/windows" }
          }
          New-Item -ItemType Directory -Force -Path package/BigJump | Out-Null
          Copy-Item -Path "$src\*" -Destination package/BigJump -Recurse -Force

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path package/BigJump `
            -DestinationPath BigJump-Windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BigJump-Windows-x64
          path: BigJump-Windows-x64.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Normalize assets and checksums
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/BigJump-Android-arm64/BigJump-Android-arm64.apk release/
          cp artifacts/BigJump-Windows-x64/BigJump-Windows-x64.zip release/
          sha256sum release/* > release/SHA256SUMS.txt
          ls -lh release

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: BigJump ${{ steps.tag.outputs.value }}
          body: |
            ## 下载 / Downloads
            - Windows x64: `BigJump-Windows-x64.zip`（解压后运行 `BigJump.exe` / unzip and run `BigJump.exe`）
            - Android arm64: `BigJump-Android-arm64.apk`（Android 10+）
            - 校验和 / Checksums: `SHA256SUMS.txt`

            ## 本次包含 / Included
            - Cloudflare 官方 IP 段 + 在线刷新 / official IP ranges with online refresh
            - DoH / DoT 加密解析 + DNSSEC 本地校验 + 国内 DoH 回退
            - 本地代理只选 IP，端到端 TLS 不降级 / local proxy picks IP only, no TLS downgrade
            - 界面支持中文 / English / UI available in Chinese and English
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/BigJump-Windows-x64.zip
            release/BigJump-Android-arm64.apk
            release/SHA256SUMS.txt
